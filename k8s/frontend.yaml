apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadtest-controller
  namespace: order-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: loadtest-controller}
  template:
    metadata:
      labels: {app: loadtest-controller}
    spec:
      containers:
        - name: controller
          image: order-loadtest-controller:local
          imagePullPolicy: IfNotPresent
          env:
            - {name: BASE_URL, value: "http://order-gateway:8081"}
            - {name: K6_PROMETHEUS_RW_SERVER_URL, value: "http://prometheus:9090/api/v1/write"}
            - {name: K6_PROMETHEUS_RW_TREND_STATS, value: "avg,min,max,med,p(90),p(95)"}
            - {name: K6_PROMETHEUS_RW_STALE_MARKERS, value: "false"}
          ports:
            - {name: http, containerPort: 6565}
          readinessProbe:
            httpGet: {path: /status, port: http}
          livenessProbe:
            httpGet: {path: /status, port: http}
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: loadtest-controller
  namespace: order-system
spec:
  selector: {app: loadtest-controller}
  ports:
    - {name: http, port: 6565, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-frontend
  namespace: order-system
spec:
  replicas: 2
  selector:
    matchLabels: {app: order-frontend}
  template:
    metadata:
      labels: {app: order-frontend}
    spec:
      containers:
        - name: frontend
          image: order-frontend:local
          imagePullPolicy: IfNotPresent
          env:
            - {name: BACKEND_URL, value: "http://order-gateway:8081"}
          ports:
            - {name: http, containerPort: 80}
          readinessProbe:
            httpGet: {path: /, port: http}
          livenessProbe:
            httpGet: {path: /, port: http}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: order-frontend
  namespace: order-system
spec:
  type: NodePort
  selector: {app: order-frontend}
  ports:
    - {name: http, port: 80, targetPort: http, nodePort: 30517}
