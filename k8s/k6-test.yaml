apiVersion: v1
kind: ConfigMap
metadata:
  name: order-k6-script
  namespace: order-system
data:
  smoke.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';
    export const options = { vus: 20, duration: '30s' };
    export default function () {
      const response = http.get('http://order-gateway:8081/api/products/999999999', {
        headers: { 'X-Client-Id': `k8s-vu-${__VU}` },
      });
      check(response, {
        'gateway routes to order service': r => r.status === 404,
        'instance header exists': r => Boolean(r.headers['X-Order-Instance']),
      });
      sleep(0.2);
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: order-k6-smoke
  namespace: order-system
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.57.0
          args: [run, --out, experimental-prometheus-rw, /scripts/smoke.js]
          env:
            - {name: K6_PROMETHEUS_RW_SERVER_URL, value: "http://prometheus:9090/api/v1/write"}
            - {name: K6_PROMETHEUS_RW_TREND_STATS, value: "avg,min,max,med,p(90),p(95)"}
            - {name: K6_PROMETHEUS_RW_STALE_MARKERS, value: "false"}
          volumeMounts:
            - {name: script, mountPath: /scripts}
          resources:
            requests: {cpu: 200m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
      volumes:
        - name: script
          configMap: {name: order-k6-script}
  backoffLimit: 0
