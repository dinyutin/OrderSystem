x-order-app: &order-app
  build: .
  image: order-system:local
  environment: &order-environment
    DB_URL: jdbc:mysql://mysql:3306/order_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    DB_USERNAME: order_app
    DB_PASSWORD: order_password
    REDIS_HOST: redis
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ORDER_MAX_CONCURRENT: 350
    SERVER_MAX_THREADS: 350
    SERVER_ACCEPT_COUNT: 500
    DB_POOL_MAX_SIZE: 30
    SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: 10000
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: order_system
      MYSQL_USER: order_app
      MYSQL_PASSWORD: order_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uorder_app", "-porder_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: confluentinc/cp-kafka:7.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20

  app1:
    <<: *order-app
    environment:
      <<: *order-environment
      INSTANCE_ID: order-app-1
    ports:
      - "8082:8080"

  app2:
    <<: *order-app
    environment:
      <<: *order-environment
      INSTANCE_ID: order-app-2
    ports:
      - "8083:8080"

  app3:
    <<: *order-app
    environment:
      <<: *order-environment
      INSTANCE_ID: order-app-3
    ports:
      - "8084:8080"

  gateway:
    build: ./gateway
    image: order-gateway:local
    environment:
      REDIS_HOST: redis
      ORDER_INSTANCE_1: http://app1:8080
      ORDER_INSTANCE_2: http://app2:8080
      ORDER_INSTANCE_3: http://app3:8080
      RATE_LIMIT_REPLENISH: ${GATEWAY_RATE_LIMIT:-5000}
      RATE_LIMIT_BURST: ${GATEWAY_RATE_BURST:-5000}
    ports:
      - "8080:8081"
    depends_on:
      - app1
      - app2
      - app3
      - redis

  frontend:
    build: ./frontend
    image: order-frontend:local
    environment:
      BACKEND_URL: http://gateway:8081
    ports:
      - "5173:80"
    depends_on:
      - gateway
      - loadtest-controller

  loadtest-controller:
    build:
      context: .
      dockerfile: load-test/controller/Dockerfile
    image: order-loadtest-controller:local
    environment:
      BASE_URL: http://gateway:8081
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: avg,min,max,med,p(90),p(95)
      K6_PROMETHEUS_RW_STALE_MARKERS: "false"
    depends_on:
      - gateway

  prometheus:
    image: prom/prometheus:v3.4.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    depends_on:
      - gateway
    profiles: ["observability", "loadtest"]

  grafana:
    image: grafana/grafana:12.0.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    profiles: ["observability"]

  k6:
    image: grafana/k6:0.57.0
    volumes:
      - ./load-test:/scripts:ro
    environment:
      BASE_URL: http://gateway:8081
      VUS: ${K6_VUS:-1000}
      TOTAL_ORDERS: ${K6_TOTAL_ORDERS:-10000}
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: avg,min,max,med,p(90),p(95)
      K6_PROMETHEUS_RW_STALE_MARKERS: "false"
    command: ["run", "--out", "experimental-prometheus-rw", "/scripts/async-checkout-load.js"]
    depends_on:
      - gateway
      - prometheus
    profiles: ["loadtest"]

volumes:
  mysql-data:
