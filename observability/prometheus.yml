global:
  scrape_interval: 5s

scrape_configs:
  - job_name: order-system
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app1:8080", "app2:8080", "app3:8080"]
  - job_name: order-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:8081"]
